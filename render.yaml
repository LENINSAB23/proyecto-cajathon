services:
  - type: web
    name: caja-inteligente
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "False"
      - key: DEMO_LOGIN_ENABLED
        value: "False"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: HEALTH_MORA_WARNING
        value: "5.0"
      - key: HEALTH_MORA_CRITICAL
        value: "10.0"
      - key: GEO_MORA_MEDIUM
        value: "8.0"
      - key: GEO_MORA_HIGH
        value: "20.0"
